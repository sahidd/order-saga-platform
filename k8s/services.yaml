apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: order-saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: order-service:local
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: saga-config
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/orderdb
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: order-saga
spec:
  selector:
    app: order
  ports:
    - port: 8081
      targetPort: 8081
---
