apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: order-saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: api-gateway:local
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: saga-config
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: APP_ROUTES_ORDER
              value: http://order:8081
            - name: APP_ROUTES_INVENTORY
              value: http://inventory:8082
            - name: APP_ROUTES_PAYMENT
              value: http://payment:8083
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: order-saga
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
