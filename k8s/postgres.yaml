apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: order-saga
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orderdb
            - name: POSTGRES_USER
              value: saga
            - name: POSTGRES_PASSWORD
              value: saga
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "saga", "-d", "orderdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "saga", "-d", "orderdb"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: order-saga
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
